syntax = "proto3";

package aeroarc.agent.v1;

option go_package = "github.com/aero-arc/aero-arc-protos/gen/go/aeroarc/agent/v1;agentv1";

// Agent → Relay RPC API
// This public service name predates lint enforcement and cannot be changed
// without breaking generated clients.
// buf:lint:ignore SERVICE_SUFFIX
service AgentGateway {
  // Initial connection handshake.
  rpc Register(RegisterRequest) returns (RegisterResponse);

  // Bidirectional telemetry streaming.
  // These established stream envelope names intentionally describe direction.
  // buf:lint:ignore RPC_REQUEST_STANDARD_NAME
  // buf:lint:ignore RPC_RESPONSE_STANDARD_NAME
  rpc TelemetryStream(stream AgentStreamMessage) returns (stream RelayStreamMessage);
}

// ----- Registration -----

message RegisterRequest {
  string agent_id = 1;

  string agent_version = 2;
  string platform = 3; // e.g. "linux/arm64"
}

message RegisterResponse {
  string agent_id = 1;
  string session_id = 3;

  int64 max_inflight = 4; // recommended unacked frames in flight
}

// ----- Telemetry -----

message TelemetryFrame {
  string session_id = 1; // server-issued session ID from RegisterResponse
  string agent_id = 2;

  // Monotonically increasing sequence within the wal_id append generation.
  uint64 seq = 3;

  int64 sent_at_unix_ns = 4;
  double device_timestamp_sec = 5;

  bytes raw_mavlink = 6;
  string dialect = 7;
  uint32 msg_id = 8;
  string msg_name = 9;

  // Parsed MAVLink fields as stringified key/value pairs.
  // Not guaranteed to preserve original types.
  map<string, string> fields = 10;

  // Capture-time operation context. The agent persists these values with the
  // frame before WAL insertion so replay retains the original attribution.
  string flight_id = 11;
  string intent_id = 12;
  uint32 intent_version = 13;

  // Durable identity of the Agent WAL append generation that owns seq. The
  // agent stamps wal_id into each frame before its first persistence, and
  // persisted frames retain it across delivery retries and process restarts.
  // A WAL opened for new capture must rotate to a fresh generation, including
  // after its database is cloned or restored, so (wal_id, seq) is never reused.
  string wal_id = 14;
}

message TelemetryAck {
  string frame_id = 1;
  uint64 seq = 2;

  enum Status {
    // This public enum value predates lint enforcement and cannot be renamed
    // without changing its JSON representation.
    // buf:lint:ignore ENUM_ZERO_VALUE_SUFFIX
    STATUS_OK = 0;
    STATUS_TEMPORARY_ERROR = 1;
    STATUS_PERMANENT_ERROR = 2;
    STATUS_RETRY_WITH_BACKOFF = 3;
  }

  Status status = 3;
  string error = 4;
}

// AgentStreamMessage multiplexes telemetry and acknowledgements for commands
// received from the relay on the same bidirectional stream.
message AgentStreamMessage {
  oneof payload {
    TelemetryFrame telemetry_frame = 1;
    OperationContextCommandAck operation_context_command_ack = 2;
    AircraftCommandResult aircraft_command_result = 3;
    MissionDeploymentResult mission_deployment_result = 4;
  }
}

// RelayStreamMessage multiplexes telemetry delivery acknowledgements and
// operation-context commands sent to the agent.
message RelayStreamMessage {
  oneof payload {
    TelemetryAck telemetry_ack = 1;
    SetOperationContextCommand set_operation_context = 2;
    ClearOperationContextCommand clear_operation_context = 3;
    AircraftCommand aircraft_command = 4;
    DeployMissionCommand deploy_mission = 5;
  }
}

// AircraftCommandType is the intentionally small set of vehicle commands
// supported by the first cloud-to-aircraft control slice.
enum AircraftCommandType {
  AIRCRAFT_COMMAND_TYPE_UNSPECIFIED = 0;
  AIRCRAFT_COMMAND_TYPE_ARM = 1;
  AIRCRAFT_COMMAND_TYPE_DISARM = 2;
}

// AircraftCommand addresses an immediate command to an Aero Arc aircraft.
// Commands are delivered only to the Agent session active when the Relay RPC
// is handled; they are not persisted or replayed after reconnect.
message AircraftCommand {
  string command_id = 1;
  string aircraft_id = 2;
  AircraftCommandType type = 3;
  int64 issued_at_unix_ms = 4;
}

// AircraftCommandResult reports the autopilot-level outcome of a command.
// STATUS_ACCEPTED means the vehicle protocol acknowledged execution, not merely
// that Relay or Agent accepted the envelope.
message AircraftCommandResult {
  string command_id = 1;
  string aircraft_id = 2;

  enum Status {
    STATUS_UNSPECIFIED = 0;
    STATUS_ACCEPTED = 1;
    STATUS_REJECTED = 2;
    STATUS_TIMEOUT = 3;
    STATUS_DELIVERY_FAILED = 4;
  }

  Status status = 3;
  string message = 4;
}

// MissionBinding identifies the immutable API-authoritative mission revision
// and the exact operation to which it may be deployed. Every non-version field
// must be non-empty, versions must be positive, and mission_digest must be the
// lowercase hexadecimal SHA-256 digest of the canonical MissionPlan.
message MissionBinding {
  string mission_id = 1;
  uint32 mission_version = 2;
  string mission_digest = 3;
  string deployment_id = 4;
  string operator_id = 5;
  string aircraft_id = 6;
  string flight_id = 7;
  string intent_id = 8;
  uint32 intent_version = 9;
}

// MissionItem is the bounded canonical representation of one MAVLink mission
// item in the first deployment slice. Schema version 1 allows only
// MAV_FRAME_GLOBAL (0), and only MAV_CMD_NAV_WAYPOINT (16), MAV_CMD_NAV_LAND
// (21), and MAV_CMD_NAV_TAKEOFF (22). Producers must require autocontinue=true;
// require sequence values contiguous from zero; and range-check latitude_e7 to
// [-900000000, 900000000] and longitude_e7 to [-1800000000, 1800000000]. The
// current field is reserved and must be false because the autopilot changes it
// dynamically during execution and readback. param1, param2, and param3 must be
// positive zero. param4 must be positive zero for WAYPOINT and TAKEOFF, and
// exactly +1 for LAND, matching stable ArduPilot readback. altitude_m must be
// finite, must round-trip through ArduPilot's signed centimeter storage, and is
// a protobuf float so the digest contains exactly the float32 value transported
// by MAVLink MISSION_ITEM_INT.z. latitude_e7 and longitude_e7 are exact
// MISSION_ITEM_INT coordinates; schema version 1 does not require them to
// round-trip through legacy MISSION_ITEM float coordinates.
message MissionItem {
  uint32 sequence = 1;
  uint32 frame = 2;
  uint32 command = 3;
  bool current = 4;
  bool autocontinue = 5;
  double param1 = 6;
  double param2 = 7;
  double param3 = 8;
  double param4 = 9;
  sint32 latitude_e7 = 10;
  sint32 longitude_e7 = 11;
  float altitude_m = 12;
}

// MissionPlan is the canonical digest input. For schema_version 1, producers
// must include 1 to 200 MissionItem records, exclude autopilot HOME entries and
// source-file/export metadata, reject unknown fields in the plan and its items,
// and compute mission_digest as lowercase hexadecimal SHA-256 over the
// deterministic protobuf serialization of this message. Consumers must enforce
// the same normalization and reject unsupported schema versions.
message MissionPlan {
  uint32 schema_version = 1;
  repeated MissionItem items = 2;
}

// DeployMissionCommand requests replacement of the autopilot's standard
// mission with one exact, immutable plan. command_id is a durable idempotency
// key and must remain stable across API and Relay retries. A delayed command
// must be rejected after expires_at_unix_ms rather than applied to a later
// operation.
message DeployMissionCommand {
  string command_id = 1;
  MissionBinding binding = 2;
  MissionPlan plan = 3;
  int64 issued_at_unix_ms = 4;
  int64 expires_at_unix_ms = 5;
}

// MissionDeploymentResult reports the durable Agent/autopilot outcome for one
// DeployMissionCommand. APPLIED and ALREADY_APPLIED require a successful
// onboard readback whose canonical digest equals binding.mission_digest.
message MissionDeploymentResult {
  string command_id = 1;
  MissionBinding binding = 2;

  enum Status {
    STATUS_UNSPECIFIED = 0;
    STATUS_APPLIED = 1;
    STATUS_ALREADY_APPLIED = 2;
    STATUS_REJECTED = 3;
    STATUS_TEMPORARY_ERROR = 4;
    STATUS_OUTCOME_UNKNOWN = 5;
    STATUS_BINDING_MISMATCH = 6;
    STATUS_ONBOARD_MISSION_MISMATCH = 7;
  }

  Status status = 3;
  string message = 4;
  uint32 uploaded_item_count = 5;
  string onboard_mission_digest = 6;
  optional uint32 mavlink_mission_ack_type = 7;
  int64 completed_at_unix_ms = 8;
}

// OperationContext identifies the API-authoritative aircraft, flight, and
// intent that the agent stamps onto newly captured telemetry frames.
// aircraft_id is additive for compatibility with existing context producers,
// but consumers must require it before accepting a mission deployment.
message OperationContext {
  string flight_id = 1;
  string intent_id = 2;
  uint32 intent_version = 3;
  string aircraft_id = 4;
}

// SetOperationContextCommand replaces the agent's active operation context.
// command_id is an idempotency key and must be stable across relay retries.
message SetOperationContextCommand {
  string command_id = 1;
  OperationContext context = 2;
}

// ClearOperationContextCommand clears the active context when authoritative is
// false and a non-empty flight_id matches it. This prevents a delayed
// conditional command from clearing a newer flight. When authoritative is
// true, flight_id must be empty and the command asserts that no operation
// context should be active; Relay may use that mode only during control-plane
// reconciliation before telemetry admission opens. The explicit discriminator
// keeps legacy messages that omit both fields safely invalid.
message ClearOperationContextCommand {
  string command_id = 1;
  string flight_id = 2;
  bool authoritative = 3;
}

// OperationContextCommandAck reports the durable result of applying a set or
// clear command. Repeated command IDs return the previously recorded result.
message OperationContextCommandAck {
  string command_id = 1;

  enum Status {
    STATUS_UNSPECIFIED = 0;
    STATUS_APPLIED = 1;
    STATUS_ALREADY_APPLIED = 2;
    STATUS_REJECTED = 3;
    STATUS_TEMPORARY_ERROR = 4;
  }

  Status status = 2;
  string error = 3;
  OperationContext active_context = 4;
}
