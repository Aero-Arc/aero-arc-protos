syntax = "proto3";

package aeroarc.relay.v1;

import "aeroarc/agent/v1/agent.proto";

option go_package = "github.com/aero-arc/aero-arc-protos/gen/go/aeroarc/relay/v1;relayv1";

// RelayControl exposes control-plane APIs for observing and updating live
// agent sessions managed by a relay. It is consumed by aero-arc-api.
// This public service name predates lint enforcement and cannot be changed
// without breaking generated clients.
// buf:lint:ignore SERVICE_SUFFIX
service RelayControl {
  // Pull durable aircraft completion notifications, including disconnected Agents.
  rpc ListFlightCompletions(ListFlightCompletionsRequest) returns (ListFlightCompletionsResponse);
  // Acknowledge only after the API durably admits the exact event.
  rpc AckFlightCompletions(AckFlightCompletionsRequest) returns (AckFlightCompletionsResponse);
  // Exchange a durable command for replayable Agent evidence.
  rpc ExchangeCommand(ExchangeCommandRequest) returns (ExchangeCommandResponse);
  // ExecuteCommand delivers once and streams cumulative durable Agent evidence.
  // Stream loss does not prove any execution outcome. Reconnect with the same
  // command identity to recover durable evidence; never infer non-execution.
  rpc ExecuteCommand(ExecuteCommandRequest) returns (stream ExecuteCommandResponse);

  // List all drones currently connected to this relay.
  rpc ListActiveDrones(ListActiveDronesRequest) returns (ListActiveDronesResponse);

  // Get the current status of a single drone by drone_id.
  rpc GetDroneStatus(GetDroneStatusRequest) returns (GetDroneStatusResponse);

  // Set and durably confirm the active operation context on an agent.
  rpc SetOperationContext(SetOperationContextRequest) returns (SetOperationContextResponse);

  // Clear and durably confirm the active operation context on an agent.
  rpc ClearOperationContext(ClearOperationContextRequest) returns (ClearOperationContextResponse);

  // Send an immediate ARM or DISARM command to the currently connected Agent
  // session and wait for its autopilot-level result.
  rpc SendAircraftCommand(SendAircraftCommandRequest) returns (SendAircraftCommandResponse);

  // Deploy one immutable mission to the currently connected Agent session and
  // wait for its correlated upload-and-readback result.
  rpc DeployMission(DeployMissionRequest) returns (DeployMissionResponse);
}

// ----- Requests -----

message ListActiveDronesRequest {
  // Reserved for future filters (region, flight_id, etc.)
}

message GetDroneStatusRequest {
  string drone_id = 1;
}

message SetOperationContextRequest {
  string agent_id = 1;
  aeroarc.agent.v1.SetOperationContextCommand command = 2;
}

message ClearOperationContextRequest {
  string agent_id = 1;
  aeroarc.agent.v1.ClearOperationContextCommand command = 2;
}

message SendAircraftCommandRequest {
  string agent_id = 1;
  aeroarc.agent.v1.AircraftCommand command = 2;
}

message DeployMissionRequest {
  string agent_id = 1;
  aeroarc.agent.v1.DeployMissionCommand command = 2;
}

// ----- Responses -----

message ListActiveDronesResponse {
  repeated DroneStatus drones = 1;
}

message GetDroneStatusResponse {
  DroneStatus drone = 1;
}

// A successful RPC response means the relay received an acknowledgement from
// the target agent. Transport, offline-agent, and deadline failures are
// returned as gRPC errors instead.
message SetOperationContextResponse {
  aeroarc.agent.v1.OperationContextCommandAck result = 1;
}

// A successful RPC response means the relay received an acknowledgement from
// the target agent. Inspect result.status for the application outcome.
message ClearOperationContextResponse {
  aeroarc.agent.v1.OperationContextCommandAck result = 1;
}

// A successful RPC response means the target Agent returned a correlated
// result. Inspect result.status for acceptance, rejection, timeout, or a local
// Agent-to-autopilot delivery failure.
message SendAircraftCommandResponse {
  aeroarc.agent.v1.AircraftCommandResult result = 1;
}

// A successful RPC response means the target Agent returned a correlated
// deployment result. Inspect result.status before treating the mission as
// present onboard; an RPC error or OUTCOME_UNKNOWN requires reconciliation
// with the same command ID and payload rather than a newly identified upload.
message DeployMissionResponse {
  aeroarc.agent.v1.MissionDeploymentResult result = 1;
}

// ----- Core Types -----

// DroneStatus represents the relay's authoritative view
// of a live drone session.
message DroneStatus {
  // Stable drone identifier
  string drone_id = 1;

  // Server-issued session identifier
  string session_id = 2;

  // Agent identifier that registered this session
  string agent_id = 3;

  // Relay identifier (useful when aggregated by the API)
  string relay_id = 4;

  // Unix timestamp (nanoseconds) when the session was created
  int64 connected_at_unix_ns = 5;

  // Unix timestamp (nanoseconds) of last observed heartbeat/telemetry
  int64 last_heartbeat_unix_ns = 6;

  // Optional flight grouping (client-defined)
  string flight_id = 7;

  // Active intent context reported by the connected agent.
  string intent_id = 8;
  uint32 intent_version = 9;
  repeated string execution_capabilities = 10;
}

message ExchangeCommandRequest {
  string agent_id = 1;
  aeroarc.agent.v1.DurableCommand command = 2;
  string attempt_id = 3;
}
message ExchangeCommandResponse {
  aeroarc.agent.v1.CommandEvidence evidence = 1;
}

// ExecuteCommandRequest carries the same immutable authority across recovery.
message ExecuteCommandRequest {
  string agent_id = 1;
  aeroarc.agent.v1.DurableCommand command = 2;
  string attempt_id = 3;
}
// ExecuteCommandResponse contains cumulative, replayable execution evidence.
message ExecuteCommandResponse {
  aeroarc.agent.v1.CommandEvidence evidence = 1;
}

message ListFlightCompletionsRequest {
  // Maximum events to return: 1..200. Zero selects the default of 100.
  // Values above 200 must be rejected with INVALID_ARGUMENT before storage reads.
  uint32 limit = 1;
}
message ListFlightCompletionsResponse { repeated aeroarc.agent.v1.FlightCompletionEvidence events = 1; }
message AckFlightCompletionsRequest {
  // At most 200 receipts. Oversized batches must be rejected with
  // INVALID_ARGUMENT before storage access. Empty batches are a no-op.
  repeated aeroarc.agent.v1.FlightCompletionReceipt receipts = 1;
}
message AckFlightCompletionsResponse {}
