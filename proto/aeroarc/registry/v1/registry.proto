
syntax = "proto3";

package aeroarc.registry.v1;

import "aeroarc/conformance/v1/conformance.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/aero-arc/aero-arc-protos/gen/go/aeroarc/registry/v1;registryv1";

// Aero Arc Registry RPC API.
//
// The registry acts as a backend-agnostic control plane for discovering
// relays and agents, tracking liveness, and resolving agent-to-relay placement.
// This public service name predates lint enforcement and cannot be changed
// without breaking generated clients.
// buf:lint:ignore SERVICE_SUFFIX
service AeroRegistry {
  // ---- Relay lifecycle ----
  rpc RegisterRelay(RegisterRelayRequest) returns (RegisterRelayResponse);
  rpc HeartbeatRelay(HeartbeatRelayRequest) returns (HeartbeatRelayResponse);
  rpc ListRelays(ListRelaysRequest) returns (ListRelaysResponse);

  // ---- Agent lifecycle ----
  rpc RegisterAgent(RegisterAgentRequest) returns (RegisterAgentResponse);
  rpc HeartbeatAgent(HeartbeatAgentRequest) returns (HeartbeatAgentResponse);
  rpc ListAgents(ListAgentsRequest) returns (ListAgentsResponse);
  rpc GetAgentPlacement(GetAgentPlacementRequest) returns (GetAgentPlacementResponse);

  // ---- Current conformance projection ----
  rpc PublishConformanceSummary(PublishConformanceSummaryRequest) returns (PublishConformanceSummaryResponse);
  rpc GetConformanceSummary(GetConformanceSummaryRequest) returns (GetConformanceSummaryResponse);
  rpc BatchGetConformanceSummaries(BatchGetConformanceSummariesRequest) returns (BatchGetConformanceSummariesResponse);
}

// ----- Relay messages -----

message Relay {
  string relay_id = 1;

  string address = 2;
  int32 grpc_port = 3;

  // Unix timestamp (milliseconds) of last heartbeat.
  int64 last_heartbeat_unix_ms = 4;
}

message RegisterRelayRequest {
  Relay relay = 1;
}

message RegisterRelayResponse {}

message HeartbeatRelayRequest {
  string relay_id = 1;

  // Unix timestamp (milliseconds) when heartbeat was sent.
  int64 timestamp_unix_ms = 2;
}

message HeartbeatRelayResponse {}

message ListRelaysRequest {}

message ListRelaysResponse {
  repeated Relay relays = 1;
}

// ----- Agent messages -----

message Agent {
  string agent_id = 1;

  // Unix timestamp (milliseconds) of last heartbeat.
  int64 last_heartbeat_unix_ms = 2;
}

message RegisterAgentRequest {
  Agent agent = 1;

  // Relay the agent is registering through.
  string relay_id = 2;
}

message RegisterAgentResponse {}

message HeartbeatAgentRequest {
  string agent_id = 1;

  // Unix timestamp (milliseconds) when heartbeat was sent.
  int64 timestamp_unix_ms = 2;

  // Relay currently carrying this agent's telemetry stream. The registry uses
  // this identity to reject heartbeats from a relay that no longer owns the
  // agent placement.
  string relay_id = 3;
}

message HeartbeatAgentResponse {}

message AgentPlacement {
  string agent_id = 1;
  string relay_id = 2;

  // Unix timestamp (milliseconds) of last placement update.
  int64 last_updated_unix_ms = 3;
}

message GetAgentPlacementRequest {
  string agent_id = 1;
}

message GetAgentPlacementResponse {
  AgentPlacement placement = 1;
}

message ListAgentsRequest {};

message ListAgentsResponse {
  repeated Agent agents = 1;
}

// ----- Current conformance projection -----

enum ConformancePublishDisposition {
  CONFORMANCE_PUBLISH_DISPOSITION_UNSPECIFIED = 0;
  CONFORMANCE_PUBLISH_DISPOSITION_APPLIED = 1;
  CONFORMANCE_PUBLISH_DISPOSITION_IDEMPOTENT = 2;
}

message ConformanceProjection {
  aeroarc.conformance.v1.ConformanceSummary summary = 1;
  google.protobuf.Timestamp stored_at = 2;
  google.protobuf.Timestamp expires_at = 3;
}

message PublishConformanceSummaryRequest {
  aeroarc.conformance.v1.ConformanceSummary summary = 1;
}

message PublishConformanceSummaryResponse {
  ConformancePublishDisposition disposition = 1;
  ConformanceProjection projection = 2;
}

message GetConformanceSummaryRequest {
  string assignment_id = 1;
}

message GetConformanceSummaryResponse {
  ConformanceProjection projection = 1;
}

message BatchGetConformanceSummariesRequest {
  repeated string assignment_ids = 1;
}

message BatchGetConformanceSummariesResponse {
  repeated ConformanceProjection projections = 1;
  repeated string missing_assignment_ids = 2;
}
